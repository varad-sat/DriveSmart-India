<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="deliveryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#112240" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="whiteCar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="podiumLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#deliveryBg)" />

  <!-- Warm Spotlight over delivery podium -->
  <ellipse cx="600" cy="480" rx="420" ry="80" fill="url(#podiumLight)" />
  <ellipse cx="600" cy="480" rx="380" ry="30" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Confetti Elements -->
  <g fill="#FF6B1A" opacity="0.7">
    <circle cx="200" cy="80" r="4" />
    <rect x="340" y="120" width="8" height="4" transform="rotate(25 340 120)" />
    <circle cx="850" cy="90" r="5" />
    <rect x="980" y="140" width="7" height="4" transform="rotate(-35 980 140)" />
    <circle cx="520" cy="60" r="3" fill="#fbbf24" />
    <rect x="680" y="75" width="8" height="4" fill="#fbbf24" transform="rotate(45 680 75)" />
  </g>

  <!-- Gleaming Pearl White SUV on Delivery Podium -->
  <g id="deliveryCar" transform="translate(180, 160)">
    <!-- Shadow -->
    <ellipse cx="440" cy="300" rx="360" ry="18" fill="#020617" opacity="0.9" />

    <!-- Car Body -->
    <path d="M 120,260 Q 180,200 240,260 L 640,260 Q 700,200 760,260 L 860,250 C 870,220 860,180 820,160 L 760,130 L 620,40 L 360,40 L 240,120 L 160,160 C 140,190 150,230 200,260 Z" fill="url(#whiteCar)" stroke="#94a3b8" stroke-width="2" />

    <!-- Windows (Tinted) -->
    <path d="M 370,50 L 605,50 L 735,125 L 600,125 Z" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <path d="M 350,55 L 265,125 L 580,125 L 360,55 Z" fill="#0f172a" stroke="#475569" stroke-width="3" />

    <!-- Headlamps & DRLs -->
    <polygon points="165,155 220,150 205,175 160,170" fill="#ffffff" />
    <line x1="160" y1="150" x2="230" y2="148" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Front Festive Ribbon & Bow -->
    <!-- Ribbon crossing the hood -->
    <polygon points="260,120 290,120 380,240 350,240" fill="url(#ribbonRed)" />
    <polygon points="260,140 290,140 220,240 190,240" fill="url(#ribbonRed)" />
    <!-- Giant Ribbon Bow on Hood -->
    <g transform="translate(270, 130)">
      <ellipse cx="-20" cy="-10" rx="28" ry="18" fill="url(#ribbonRed)" transform="rotate(-30 -20 -10)" />
      <ellipse cx="20" cy="-10" rx="28" ry="18" fill="url(#ribbonRed)" transform="rotate(30 20 -10)" />
      <circle cx="0" cy="0" r="14" fill="#991b1b" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Front Wheel -->
    <circle cx="210" cy="260" r="50" fill="#020617" stroke="#475569" stroke-width="6" />
    <circle cx="210" cy="260" r="30" fill="#1e293b" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="210" cy="260" r="10" fill="#f8fafc" />

    <!-- Rear Wheel -->
    <circle cx="730" cy="260" r="50" fill="#020617" stroke="#475569" stroke-width="6" />
    <circle cx="730" cy="260" r="30" fill="#1e293b" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="730" cy="260" r="10" fill="#f8fafc" />
  </g>

  <!-- Key Handover Ceremony Silhouettes -->
  <g transform="translate(60, 260)" fill="#e2e8f0">
    <!-- Showroom Executive in Suit Handing Key -->
    <circle cx="100" cy="50" r="16" />
    <path d="M 85,72 L 115,72 L 120,170 L 105,170 L 100,120 L 95,170 L 80,170 Z" />
    <!-- Arm extending forward with smart key -->
    <path d="M 115,85 L 160,105" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
    <!-- Smart Key Fob Icon -->
    <rect x="165" y="98" width="16" height="24" rx="5" fill="#0B1F3A" stroke="#FF6B1A" stroke-width="2" />

    <!-- Young Car Buyer Receiving Key Joyfully -->
    <circle cx="220" cy="60" r="16" />
    <path d="M 205,82 L 235,82 L 240,170 L 225,170 L 220,120 L 215,170 L 200,170 Z" />
    <!-- Arm extending to grasp key -->
    <path d="M 205,95 L 180,105" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Floating Checklist Badge -->
  <g transform="translate(760, 60)">
    <rect width="380" height="130" rx="16" fill="#0B1F3A" fill-opacity="0.95" stroke="#25436c" stroke-width="2" />
    <text x="25" y="32" font-family="Inter, sans-serif" font-weight="900" font-size="15" fill="#ffffff">FIRST CAR BUYING ROADMAP</text>
    <text x="25" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">✓ 20/4/10 Finance Budget Rule</text>
    <text x="25" y="75" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">✓ Remove Dealer Handling Fees</text>
    <text x="25" y="95" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">✓ Zero-Dep & Engine Protection</text>
    <text x="25" y="115" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">✓ Daylight Pre-Delivery Inspection</text>
  </g>

  <!-- Bottom Banner -->
  <text x="600" y="590" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle">
    DriveSmart India: 10 Simple Steps to Buy Your First Car with Total Confidence
  </text>
</svg>
