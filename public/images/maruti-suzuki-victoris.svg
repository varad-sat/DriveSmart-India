<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="vicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1805" />
      <stop offset="100%" stop-color="#3b2f0a" />
    </linearGradient>
    <linearGradient id="vicPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#vicBg)" />
  <polygon points="0,260 600,260 600,360 0,360" fill="#0f0c02" />
  <ellipse cx="300" cy="285" rx="240" ry="16" fill="#020617" opacity="0.9" />

  <rect x="30" y="25" width="180" height="28" rx="6" fill="#0B1F3A" stroke="#eab308" />
  <text x="120" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#fde047" text-anchor="middle">MARUTI SUZUKI VICTORIS</text>

  <!-- Aerodynamic Sportback Fastback Coupe Silhouette -->
  <g transform="translate(60, 80)">
    <path d="M 70,180 Q 110,135 150,180 L 370,180 Q 410,135 450,180 L 485,175 C 490,145 470,115 440,95 L 360,50 L 220,35 L 140,85 L 60,115 C 45,135 50,160 70,180 Z" fill="url(#vicPaint)" />
    <!-- Swept Coupe Roofline -->
    <path d="M 225,40 L 350,55 L 430,95 L 280,95 Z" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <path d="M 215,40 L 148,85 L 270,85 L 220,40 Z" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <!-- Connected LED Tail Lightbar Edge -->
    <polygon points="480,115 490,120 485,130 475,125" fill="#ef4444" />
    <!-- Dynamic Multi-Spoke Alloy Wheels -->
    <circle cx="130" cy="180" r="34" fill="#020617" stroke="#eab308" stroke-width="4" />
    <circle cx="430" cy="180" r="34" fill="#020617" stroke="#eab308" stroke-width="4" />
  </g>

  <text x="300" y="335" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#fef08a" text-anchor="middle">
    Crossover Coupe • Self-Charging Strong Hybrid (27.9 km/l) • Head-Up Display
  </text>
</svg>
