<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="nissanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1022" />
      <stop offset="100%" stop-color="#341b3a" />
    </linearGradient>
    <linearGradient id="nissanPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#nissanBg)" />
  <polygon points="0,260 600,260 600,360 0,360" fill="#0f0712" />
  <ellipse cx="300" cy="285" rx="240" ry="16" fill="#020617" opacity="0.9" />

  <rect x="30" y="25" width="160" height="28" rx="6" fill="#0B1F3A" stroke="#a855f7" />
  <text x="110" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#d8b4fe" text-anchor="middle">NISSAN GRAVITE</text>

  <!-- Accessible Crossover Profile -->
  <g transform="translate(65, 80)">
    <path d="M 75,180 Q 115,135 155,180 L 375,180 Q 415,135 455,180 L 485,175 C 490,145 470,115 445,100 L 390,75 L 330,30 L 190,30 L 125,75 L 60,110 C 45,130 50,160 75,180 Z" fill="url(#nissanPaint)" />
    <!-- Cabin Glass -->
    <path d="M 195,35 L 330,35 L 385,75 L 435,100 L 135,100 Z" fill="#0f172a" stroke="#d8b4fe" stroke-width="2" />
    <!-- V-Motion Chrome Accent -->
    <path d="M 55,110 L 70,125 L 85,110" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Robust Ground Clearance Wheels -->
    <circle cx="135" cy="180" r="34" fill="#020617" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="435" cy="180" r="34" fill="#020617" stroke="#cbd5e1" stroke-width="4" />
  </g>

  <text x="300" y="335" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#e9d5ff" text-anchor="middle">
    Accessible Compact Crossover • 205 mm Ground Clearance • Dual-Cylinder CNG
  </text>
</svg>
