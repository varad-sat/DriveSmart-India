<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fuelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="50%" stop-color="#0f213d" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>
    <linearGradient id="evGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="cngGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="dieselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="petrolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#fuelBg)" />

  <!-- Road base -->
  <polygon points="0,420 1200,420 1200,630 0,630" fill="url(#roadGrad)" />
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#334155" stroke-width="3" />
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#fbbf24" stroke-width="4" stroke-dasharray="30 25" />

  <!-- Title Top Banner -->
  <g transform="translate(60, 40)">
    <rect width="400" height="48" rx="10" fill="#0B1F3A" stroke="#25436c" stroke-width="1.5" />
    <text x="20" y="30" font-family="Inter, sans-serif" font-weight="900" font-size="16" fill="#ffffff">POWERTRAIN COMPARISON 2026</text>
    <text x="310" y="30" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#FF6B1A">INDIA</text>
  </g>

  <!-- 4 Fueling Pillars / Hubs -->
  <!-- 1. ELECTRIC (EV) -->
  <g transform="translate(80, 120)">
    <rect width="230" height="280" rx="18" fill="#091b2c" stroke="#10b981" stroke-width="2.5" />
    <rect x="20" y="20" width="190" height="70" rx="10" fill="url(#evGrad)" />
    <!-- EV Plug Icon -->
    <path d="M 115,35 L 105,55 L 115,55 L 110,75 L 125,50 L 115,50 Z" fill="#ffffff" />
    <text x="115" y="125" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">ELECTRIC (EV)</text>
    <text x="115" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#34d399" text-anchor="middle">₹1.20 – ₹1.60 / km</text>
    <text x="115" y="180" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Home AC Wallbox</text>
    <text x="115" y="200" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Zero Tailpipe Emission</text>
    <rect x="25" y="225" width="180" height="35" rx="8" fill="#10b981" fill-opacity="0.2" />
    <text x="115" y="247" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#6ee7b7" text-anchor="middle">BEST: DAILY COMMUTES</text>
  </g>

  <!-- 2. CNG -->
  <g transform="translate(345, 120)">
    <rect width="230" height="280" rx="18" fill="#091b2c" stroke="#0284c7" stroke-width="2" />
    <rect x="20" y="20" width="190" height="70" rx="10" fill="url(#cngGrad)" />
    <!-- CNG Cylinder Icon -->
    <rect x="100" y="40" width="30" height="36" rx="6" fill="#ffffff" />
    <path d="M 108,35 L 122,35 L 120,40 L 110,40 Z" fill="#ffffff" />
    <text x="115" y="125" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">CNG DUAL-TANK</text>
    <text x="115" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">₹2.80 – ₹3.50 / km</text>
    <text x="115" y="180" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">24–28 km/kg Mileage</text>
    <text x="115" y="200" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Factory-Fitted Safe</text>
    <rect x="25" y="225" width="180" height="35" rx="8" fill="#0284c7" fill-opacity="0.2" />
    <text x="115" y="247" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#7dd3fc" text-anchor="middle">BEST: HIGH CITY RUN</text>
  </g>

  <!-- 3. DIESEL -->
  <g transform="translate(615, 120)">
    <rect width="230" height="280" rx="18" fill="#091b2c" stroke="#64748b" stroke-width="2" />
    <rect x="20" y="20" width="190" height="70" rx="10" fill="url(#dieselGrad)" />
    <!-- Diesel Pump Icon -->
    <path d="M 105,40 L 125,40 L 125,70 L 105,70 Z M 125,46 L 135,55 L 132,65" fill="none" stroke="#ffffff" stroke-width="3" />
    <text x="115" y="125" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">TURBO DIESEL</text>
    <text x="115" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#94a3b8" text-anchor="middle">₹5.20 – ₹6.50 / km</text>
    <text x="115" y="180" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Huge Low-End Torque</text>
    <text x="115" y="200" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">NCR 10-Yr Limit Note</text>
    <rect x="25" y="225" width="180" height="35" rx="8" fill="#64748b" fill-opacity="0.2" />
    <text x="115" y="247" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#cbd5e1" text-anchor="middle">BEST: LONG HIGHWAYS</text>
  </g>

  <!-- 4. PETROL -->
  <g transform="translate(885, 120)">
    <rect width="230" height="280" rx="18" fill="#091b2c" stroke="#FF6B1A" stroke-width="2.5" />
    <rect x="20" y="20" width="190" height="70" rx="10" fill="url(#petrolGrad)" />
    <!-- Petrol Nozzle Icon -->
    <circle cx="115" cy="55" r="14" fill="#ffffff" />
    <path d="M 115,45 C 110,55 110,60 115,65 C 120,60 120,55 115,45 Z" fill="#FF6B1A" />
    <text x="115" y="125" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">PETROL (E20)</text>
    <text x="115" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#fb923c" text-anchor="middle">₹6.50 – ₹8.50 / km</text>
    <text x="115" y="180" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Lowest Showroom Cost</text>
    <text x="115" y="200" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Refined & Silent Engine</text>
    <rect x="25" y="225" width="180" height="35" rx="8" fill="#FF6B1A" fill-opacity="0.2" />
    <text x="115" y="247" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#fdba74" text-anchor="middle">BEST: &lt; 800 KM/MO</text>
  </g>

  <!-- Sleek Modern Car Silhouette along the road -->
  <g transform="translate(260, 440)">
    <!-- Shadow -->
    <ellipse cx="340" cy="80" rx="280" ry="14" fill="#020617" opacity="0.8" />
    <!-- Body -->
    <path d="M 100,60 Q 140,25 200,25 L 420,25 Q 520,25 580,60 L 610,65 C 610,45 570,10 460,5 L 260,5 L 130,35 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 100,60 L 600,60 L 620,70 L 60,70 Z" fill="#0f172a" />
    <!-- Wheels -->
    <circle cx="180" cy="70" r="26" fill="#020617" stroke="#94a3b8" stroke-width="4" />
    <circle cx="500" cy="70" r="26" fill="#020617" stroke="#94a3b8" stroke-width="4" />
    <!-- Headlight beam -->
    <polygon points="620,62 760,40 760,85 620,70" fill="#fed7aa" opacity="0.25" />
  </g>

  <!-- Bottom Comparison Tagline -->
  <text x="600" y="600" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" text-anchor="middle">
    DriveSmart India: Compare Total Cost of Ownership (Purchase + Running + Servicing + 5-Yr Resale)
  </text>
</svg>
