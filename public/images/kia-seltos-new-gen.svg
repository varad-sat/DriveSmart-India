<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="seltosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05181e" />
      <stop offset="100%" stop-color="#0c2b33" />
    </linearGradient>
    <linearGradient id="seltosPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#seltosBg)" />
  <polygon points="0,260 600,260 600,360 0,360" fill="#020d10" />
  <ellipse cx="300" cy="285" rx="240" ry="16" fill="#020617" opacity="0.9" />

  <rect x="30" y="25" width="160" height="28" rx="6" fill="#0B1F3A" stroke="#10b981" />
  <text x="110" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#6ee7b7" text-anchor="middle">KIA SELTOS NEW-GEN</text>

  <!-- Mid-size SUV Profile -->
  <g transform="translate(65, 80)">
    <path d="M 75,180 Q 115,135 155,180 L 375,180 Q 415,135 455,180 L 485,175 C 490,145 475,115 450,100 L 400,75 L 340,30 L 190,30 L 125,75 L 60,110 C 45,130 50,160 75,180 Z" fill="url(#seltosPaint)" />
    <!-- Panoramic Sunroof Roofline -->
    <path d="M 195,35 L 335,35 L 395,75 L 440,100 L 135,100 Z" fill="#0f172a" stroke="#6ee7b7" stroke-width="2" />
    <!-- Star-Map Connected Lightbar -->
    <line x1="55" y1="110" x2="115" y2="105" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <polygon points="52,110 58,105 58,118" fill="#38bdf8" />
    <!-- Wheels -->
    <circle cx="135" cy="180" r="34" fill="#020617" stroke="#34d399" stroke-width="5" />
    <circle cx="435" cy="180" r="34" fill="#020617" stroke="#34d399" stroke-width="5" />
  </g>

  <text x="300" y="335" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#a7f3d0" text-anchor="middle">
    Mid-Size Benchmark • Dual 12.3-inch Curved Cockpit • Level 2 ADAS • Bose Audio
  </text>
</svg>
