<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="skodaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051912" />
      <stop offset="100%" stop-color="#0a2c20" />
    </linearGradient>
    <linearGradient id="skodaPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#skodaBg)" />
  <polygon points="0,260 600,260 600,360 0,360" fill="#020d09" />
  <ellipse cx="300" cy="285" rx="240" ry="16" fill="#020617" opacity="0.9" />

  <rect x="30" y="25" width="180" height="28" rx="6" fill="#0B1F3A" stroke="#22c55e" />
  <text x="120" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#86efac" text-anchor="middle">SKODA KUSHAQ FACELIFT</text>

  <!-- European Crystalline Athletic Silhouette -->
  <g transform="translate(65, 80)">
    <path d="M 75,180 Q 115,135 155,180 L 375,180 Q 415,135 455,180 L 485,175 C 490,145 470,115 445,100 L 390,75 L 330,30 L 190,30 L 125,75 L 60,110 C 45,130 50,160 75,180 Z" fill="url(#skodaPaint)" />
    <!-- Sharp European Glasshouse -->
    <path d="M 195,35 L 330,35 L 385,75 L 435,100 L 135,100 Z" fill="#0f172a" stroke="#86efac" stroke-width="2" />
    <!-- Crystalline LED Headlight and Butterfly Grille Accent -->
    <line x1="55" y1="110" x2="110" y2="108" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="55" cy="110" r="4" fill="#4ade80" />
    <!-- Precise Diamond-Cut Wheels -->
    <circle cx="135" cy="180" r="34" fill="#020617" stroke="#cbd5e1" stroke-width="5" />
    <circle cx="435" cy="180" r="34" fill="#020617" stroke="#cbd5e1" stroke-width="5" />
  </g>

  <text x="300" y="335" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#bbf7d0" text-anchor="middle">
    5-Star Crash Safety • 1.5L TSI Turbo Petrol • European Handling &amp; ADAS
  </text>
</svg>
