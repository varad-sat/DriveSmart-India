<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021422" />
      <stop offset="100%" stop-color="#072b44" />
    </linearGradient>
    <linearGradient id="xevPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="copperTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#evBg)" />
  <polygon points="0,260 600,260 600,360 0,360" fill="#010c14" />
  <ellipse cx="300" cy="285" rx="240" ry="16" fill="#020617" opacity="0.9" />

  <rect x="30" y="25" width="160" height="28" rx="6" fill="#0B1F3A" stroke="#0284c7" />
  <text x="110" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle">MAHINDRA XEV 9S</text>

  <!-- Born Electric Fastback Coupe Silhouette -->
  <g transform="translate(60, 80)">
    <path d="M 70,180 Q 110,135 150,180 L 370,180 Q 410,135 450,180 L 485,175 C 490,145 465,115 440,95 L 360,50 L 220,35 L 140,85 L 60,115 C 45,135 50,160 70,180 Z" fill="url(#xevPaint)" />
    <!-- Fastback Swept Roof Glass -->
    <path d="M 225,40 L 350,55 L 430,95 L 280,95 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M 215,40 L 148,85 L 270,85 L 220,40 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Copper aerodynamic accent line -->
    <path d="M 80,120 Q 250,105 460,120" stroke="url(#copperTrim)" stroke-width="3" fill="none" />
    <!-- Sharp EV DRLs -->
    <line x1="55" y1="115" x2="110" y2="110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Aero Wheels -->
    <circle cx="130" cy="180" r="34" fill="#020617" stroke="#38bdf8" stroke-width="4" />
    <circle cx="430" cy="180" r="34" fill="#020617" stroke="#38bdf8" stroke-width="4" />
  </g>

  <text x="300" y="335" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#7dd3fc" text-anchor="middle">
    Born-Electric Coupe SUV • INGLO Architecture • 175 kW DC Fast Charge
  </text>
</svg>
